next-version: 8.0.0
mode: ContinuousDelivery
tag-prefix: '[vV]'

major-version-bump-message: '\+semver:\s*(breaking|major)'
minor-version-bump-message: '\+semver:\s*(feature|minor)'
patch-version-bump-message: '\+semver:\s*(fix|patch)'
no-bump-message: '\+semver:\s*(none|skip)'

branches:
  main:
    regex: ^master$|^main$
    mode: Mainline
    label: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    is-mainline: true
    is-release-branch: false

  develop:
    regex: ^dev$|^develop$
    mode: ContinuousDeployment
    label: alpha
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    is-mainline: false
    is-release-branch: false

  release:
    regex: ^releases?[/-]
    mode: ContinuousDelivery
    label: beta
    increment: None
    prevent-increment-of-merged-branch-version: true
    is-mainline: false
    is-release-branch: true

  feature:
    regex: ^features?[/-]
    mode: ContinuousDelivery
    label: useBranchName
    increment: Minor
    prevent-increment-of-merged-branch-version: false
    is-mainline: false
    is-release-branch: false

  pull-request:
    regex: ^pull[-/]\d+
    mode: ContinuousDelivery
    label: Pr
    increment: Inherit
    prevent-increment-of-merged-branch-version: false
    is-mainline: false
    is-release-branch: false
