name: .NET Build CI

on:
  push:
    branches: [ "main" ]

# Crucial: Grants the workflow token authority to write packages
permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - run: dotnet pack -c Release -p:PackageVersion=1.0.0
    # Fixed push command using the correct API endpoint
    - run: |
        dotnet nuget push "./bin/Release/*.nupkg" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --skip-duplicate
