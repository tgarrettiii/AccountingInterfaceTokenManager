name: .NET Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Explicitly grants the workflow permission to upload NuGet packages
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # CRITICAL: Fetches all tags and history instead of just the latest commit

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Extracts the latest tag or falls back to a default version if no tag exists yet
    - name: Get Latest Git Tag
      id: get_version
      run: |
        TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
        VERSION=${TAG#v}
        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore

    # Injects the version dynamically into the MSBuild pipeline
    - name: Build project
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.version }}

    # Runs validation tests against the release binaries
    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # Packages the project into a .nupkg file using the dynamic version
    - name: Pack NuGet Package
      run: dotnet pack --configuration Release --no-build --output ./nupkg -p:Version=${{ steps.get_version.outputs.version }}

    # Registers the feed safely and pushes using the named configuration
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget add source "https://github.com" \
          --name "github" \
          --username "tgarrettiii" \
          --password "${{ secrets.GITHUB_TOKEN }}" \
          --store-password-in-clear-text

        dotnet nuget push "./nupkg/*.nupkg" \
          --source "github" \
          --api-key "${{ secrets.GITHUB_TOKEN }}"