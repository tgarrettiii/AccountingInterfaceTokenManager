name: Generic Auto Increment Tag

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
# This cancels duplicate builds on the exact same branch reference
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Determine Target Branch
        id: target
        run: |
          # If it's a PR, target is the base branch. If it's a direct push, target is the active branch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          else
            echo "BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      # We check out the determined target branch explicitly
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0 

      - name: Calculate and Push New Tag
        run: |
          git fetch --tags origin

          # Use the target branch we determined in step 1
          TARGET_BRANCH="${{ env.BRANCH }}"
          echo "Target branch is: $TARGET_BRANCH"

          # 1. Get all commit SHAs on the target branch line
          git log --first-parent --format="%H" "origin/$TARGET_BRANCH" > target_commits.txt

          # 2. Find the most recent tag starting with 'v' belonging to this target branch line
          LATEST_TARGET_TAG=""
          for tag in $(git tag --sort=-creatordate --list "v*"); do
            TAG_SHA=$(git rev-list -n 1 "$tag")
            if grep -q "$TAG_SHA" target_commits.txt; then
              LATEST_TARGET_TAG="$tag"
              break
            fi
          done

          # 3. Fallback if no tags exist on this branch line yet
          if [ -z "$LATEST_TARGET_TAG" ]; then
            echo "No previous tags found on $TARGET_BRANCH line history. Starting at v1.0.0"
            LATEST_TARGET_TAG="v1.0.0"
          else
            echo "Latest tag on $TARGET_BRANCH branch line is: $LATEST_TARGET_TAG"
          fi

          # 4. Parse the semantic version
          VERSION=${LATEST_TARGET_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # 5. Increment the patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$NEW_PATCH"
          echo "New calculated tag: $NEW_TAG"

          # 6. Configure git identity, create, and push the new tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
