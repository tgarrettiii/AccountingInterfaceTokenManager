name: .NET Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grants the workflow native authorization to write packages
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches historical tags for versioning

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Extracts the latest tag or falls back to a default version if no tag exists yet
    - name: Sync Target Branch and Tags
      run: |
        git fetch origin main:main
        git fetch --tags --force

    - name: Run Tag Incrementor Script
      id: get_version_py
      run: python .scripts/increment_version.py "${{ github.base_ref || github.ref_name }}"

    - name: Restore dependencies
      run: dotnet restore

    # Compiles project binaries
    - name: Build project
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.get_version_py.outputs.version }}

    # Runs unit validation tests
    - name: Run Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # FIX 1: Forces the .nupkg file to compile straight into a predictable root-level folder
    - name: Pack NuGet Package
      run: dotnet pack --configuration Release --no-build --output ./nupkg -p:Version=${{ steps.get_version_py.outputs.version }}

    # FIX 2: Corrected the endpoint URL to use the designated GitHub NuGet Package Registry endpoint
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --skip-duplicate
