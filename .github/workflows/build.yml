name: CI/CD Build and Deploy

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      
      # 1. Checkout with full history (Mandatory for GitVersion)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. FIX: Prevent LibGit2Sharp from crashing on directory ownership
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 3. Setup .NET (Ensures GitVersion execution runtime is present)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 4. Install GitVersion
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      # 5. Run GitVersion
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true 

      # 6. Build and Restore
      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet Package
        run: dotnet pack --configuration Release --no-build --output ./nupkg -p:Version=${{ steps.gitversion.outputs.semVer }}

      # 7. Publish Action
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://github.com{{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
